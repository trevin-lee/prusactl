# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: prusactl

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Shell completions ship in every archive; Homebrew installs them.
    - rm -rf completions
    - mkdir completions
    - sh -c "go run ./cmd/prusactl completion bash > completions/prusactl.bash"
    - sh -c "go run ./cmd/prusactl completion zsh > completions/_prusactl"
    - sh -c "go run ./cmd/prusactl completion fish > completions/prusactl.fish"

builds:
  - id: prusactl
    main: ./cmd/prusactl
    binary: prusactl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

universal_binaries:
  - id: prusactl
    replace: true

archives:
  - id: prusactl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files: [README.md, LICENSE, completions/*]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^ci:"]

release:
  footer: |
    **Install:** `brew install trevin-lee/tap/prusactl`, `go install github.com/trevin-lee/prusactl/cmd/prusactl@{{ .Tag }}`, or download a binary below.
    `prusactl.mcpb` is a one-click MCP bundle for clients that support MCPB.
    Setup, and connecting an AI agent: see the [README](https://github.com/trevin-lee/prusactl#install).
