name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The race detector needs a C toolchain; the races it finds aren't
      # Windows-specific, and the point of the Windows job is the paths and the
      # credential store.
      - if: matrix.os != 'windows-latest'
        run: go test -race ./...
      - if: matrix.os == 'windows-latest'
        run: go test ./...
      - name: Cross-compile
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/prusactl
          done
